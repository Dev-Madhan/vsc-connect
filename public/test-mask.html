<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preloader Mask Animation Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background-color: #0b0b0e;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    /* Simulated Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 70%);
      overflow: hidden;
    }
    .hero-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, transparent 70%);
      filter: blur(60px);
      animation: pulse 4s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 0.9; }
    }
    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }
    .hero-title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto;
    }

    /* SVG Mask Preloader Overlay */
    .mask-preloader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #070707;
      z-index: 99999;
      pointer-events: auto;
      will-change: mask-size, -webkit-mask-size, opacity;

      -webkit-mask-image: linear-gradient(#000 0 0), url("/vsc-monogram.svg");
      mask-image: linear-gradient(#000 0 0), url("/vsc-monogram.svg");
      -webkit-mask-position: center, 50% 50%;
      mask-position: center, 50% 50%;
      -webkit-mask-repeat: no-repeat, no-repeat;
      mask-repeat: no-repeat, no-repeat;
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      -webkit-mask-size: 100% 100%, clamp(200px, 26vw, 360px) auto;
      mask-size: 100% 100%, clamp(200px, 26vw, 360px) auto;

      opacity: 1;
    }

    .mask-preloader.animating {
      -webkit-mask-size: 100% 100%, 1200vw auto;
      mask-size: 100% 100%, 1200vw auto;
      opacity: 0;
      pointer-events: none;
      transition: 
        mask-size 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.8s,
        -webkit-mask-size 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.8s,
        opacity 0.7s cubic-bezier(0.65, 0, 0.35, 1) 1.6s;
    }

    .mask-preloader.finished {
      display: none !important;
    }

    /* Replay Button for testing */
    .replay-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-content">
      <h1 class="hero-title">VISTARA CONNECT</h1>
      <p class="hero-desc">The official student club network platform for campus events, recruitment, and cross-club collaboration.</p>
    </div>
  </div>

  <div id="preloader" class="mask-preloader"></div>

  <button class="replay-btn" onclick="replay()">Replay Intro</button>

  <script>
    const preloader = document.getElementById('preloader');

    function startIntro() {
      // Trigger animation after initial render
      requestAnimationFrame(() => {
        preloader.classList.add('animating');
      });
      // Cleanup after full duration (0.8s delay + 1.5s animation + buffer)
      setTimeout(() => {
        preloader.classList.add('finished');
      }, 2500);
    }

    function replay() {
      preloader.classList.remove('finished');
      preloader.classList.remove('animating');
      // force reflow
      void preloader.offsetWidth;
      setTimeout(startIntro, 100);
    }

    window.addEventListener('DOMContentLoaded', startIntro);
  </script>
</body>
</html>
